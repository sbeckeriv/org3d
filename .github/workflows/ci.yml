name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: pick up new RustSec advisories

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --package org3d

      - name: Clippy
        run: cargo clippy --package org3d --all-targets -- -D warnings

      - name: Test
        run: cargo test --package org3d

      - name: Check Tauri app (Linux)
        run: cargo check --package org3d-app

  # Fails on any RustSec vulnerability in Cargo.lock. "Unmaintained" and
  # "unsound" notices (currently only Tauri's Linux GTK stack) are warnings.
  # Also runs weekly so new advisories surface without a code change.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
