[workspace]
members = [".", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"

[package]
name = "org3d"
version.workspace = true
edition = "2024"

[lib]
name = "org3d"
path = "src/lib.rs"

[[bin]]
name = "org3d"
path = "src/main.rs"

[dependencies]
# web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.23"

# database
rusqlite = { version = "0.43", features = ["bundled"] }

# 3d file parsing
zip = "9"
roxmltree = "0.21"
walkdir = "2"

# templating
minijinja = { version = "3", features = ["serde"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# utilities
anyhow = "1"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
jiff = { version = "1", features = ["tzdb-bundle-always"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "form"] }
